services:
  # ============================
  # Core services (default profile)
  # docker compose up -d
  # ============================

  # API service
  api:
    platform: linux/amd64
    build: .
    container_name: xplore-ai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/xplore_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - EMBEDDING_BASE_URL=http://ollama:11434/v1
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # PostgreSQL
  db:
    image: pgvector/pgvector:pg15
    container_name: xplore-ai-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=xplore_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xplore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis cache and broker
  redis:
    image: redis:7-alpine
    container_name: xplore-ai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Celery worker
  celery_worker:
    platform: linux/amd64
    build: .
    container_name: xplore-ai-worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/xplore_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - EMBEDDING_BASE_URL=http://ollama:11434/v1
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  # ============================
  # Optional services — enable via compose profiles
  # docker compose --profile full up -d        → includes Ollama
  # docker compose --profile monitor up -d     → includes monitoring
  # docker compose --profile full --profile monitor up -d → everything
  # ============================

  # Flower (Celery monitor)
  flower:
    platform: linux/amd64
    build: .
    container_name: xplore-ai-flower
    profiles:
      - monitor
    command: celery -A app.worker.celery_app flower --port=5555
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # Ollama (local LLM and embeddings)
  ollama:
    image: ollama/ollama:latest
    container_name: xplore-ai-ollama
    profiles:
      - full
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: xplore-ai-prometheus
    profiles:
      - monitor
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - api

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: xplore-ai-grafana
    profiles:
      - monitor
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:
